name: Build APK

on:
  push:
    branches: [main]
    # A tag is what produces a downloadable release:
    #   git tag v1.0.0 && git push origin v1.0.0
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Explicit, not the action's default of "tools platform-tools" -
          # Google retired the legacy "tools" package from its SDK repository
          # on 2026-09-14/15, which makes the action fail before anything of
          # ours even runs. Gradle/AGP fetch whatever specific platform and
          # build-tools this app needs on their own during the build below;
          # this step only needs to provide platform-tools and accept the
          # SDK licenses. (github.com/android-actions/setup-android/issues/537)
          packages: 'platform-tools'

      # Pinned rather than relying on whatever Gradle the runner image ships:
      # AGP 8.5.2 requires Gradle 8.7+, and an image bump could silently break
      # this months from now.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # A release build only happens once a keystore secret exists; until then
      # the debug APK is what gets published, which is fine for sideloading.
      - name: Decode keystore
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # One fixed filename so the "latest release" download URL never changes.
      - name: Stage APK
        run: |
          mkdir -p out
          SRC=app/build/outputs/apk/release/app-release.apk
          [ -f "$SRC" ] || SRC=app/build/outputs/apk/debug/app-debug.apk
          echo "packaging $SRC"
          cp "$SRC" out/accura-print.apk
          sha256sum out/accura-print.apk | tee out/accura-print.apk.sha256
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: accura-print-apk
          path: out/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            out/accura-print.apk \
            out/accura-print.apk.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --notes "Accura Print APK. Install on the cafe tablet that runs Accura billing.

          Direct download (always the newest release):
          https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/accura-print.apk"
